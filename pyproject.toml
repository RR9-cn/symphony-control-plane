[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "symphony-control-plane"
version = "0.1.0"
description = "Persistent Issue control plane for Symphony and Codex agents"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.17,<2",
  "aiosqlite>=0.21,<1",
  "fastapi>=0.135,<1",
  "httpx>=0.28,<1",
  "jsonschema>=4.20,<5",
  "pydantic-settings>=2.10,<3",
  "python-liquid>=2,<3",
  "PyYAML>=6,<7",
  "sqlalchemy[asyncio]>=2.0.40,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
fshows-symphony-windows = "symphony_windows.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<2",
  "types-PyYAML>=6,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
control_plane = ["ui/*.html", "ui/*.css", "ui/*.js", "templates/*.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
