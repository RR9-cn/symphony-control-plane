version: 2
entity: issue
statuses:
  - ready
  - running
  - retry_queued
  - needs_human
  - blocked
  - reviewing
  - awaiting_publish
  - pr_open
  - done
  - cancelled
terminal_statuses:
  - done
  - cancelled
transitions:
  - {from: ready, to: running, event: claimed, actor: worker}
  - {from: running, to: retry_queued, event: retry_scheduled, actor: worker}
  - {from: running, to: retry_queued, event: lease_expired, actor: system}
  - {from: retry_queued, to: ready, event: retry_due, actor: system}
  - {from: running, to: needs_human, event: human_input_requested, actor: agent}
  - {from: needs_human, to: ready, event: human_input_resolved, actor: human}
  - {from: running, to: blocked, event: agent_blocked, actor: agent}
  - {from: blocked, to: ready, event: retry_requested, actor: human}
  - {from: running, to: reviewing, event: agent_completed, actor: agent}
  - {from: running, to: cancelled, event: cancelled, actor: human}
  - {from: reviewing, to: ready, event: result_rejected, actor: human}
  - {from: reviewing, to: awaiting_publish, event: result_approved, actor: human}
  - {from: awaiting_publish, to: pr_open, event: pull_request_created, actor: human}
  - {from: pr_open, to: done, event: pull_request_merged, actor: human}
  - {from: ready, to: cancelled, event: cancelled, actor: human}
  - {from: retry_queued, to: cancelled, event: cancelled, actor: human}
  - {from: needs_human, to: cancelled, event: cancelled, actor: human}
  - {from: blocked, to: cancelled, event: cancelled, actor: human}
  - {from: reviewing, to: cancelled, event: cancelled, actor: human}
